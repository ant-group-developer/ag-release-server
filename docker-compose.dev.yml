services:
    app-dev:
        # image: ag-music-server/dev:latest
        image: ag-music-server/dev:${TAG:-latest}
        build: .
        # pull the port number from $PORT for both host and container
        ports:
            - '${HOST_PORT:-4041}:${APP_PORT}'
        env_file:
            - .env
        environment:
            - TZ=${TZ:-Asia/Ho_Chi_Minh}
            - APP_ROLE=api
            - NODE_OPTIONS=--max-old-space-size=1024
        command: yarn start:prod
        restart: unless-stopped
        volumes:
            - ./proto:/app/proto:ro
            - ./credential.json:/app/credential.json:ro
            - ./secrets:/app/secrets:ro
            - ./database.rclone.conf:/app/database.rclone.conf:ro
            - ./release_parsed:${RELEASE_PARSED_DIR}
            - ./backups:/app/backups
        mem_limit: 1500m
        cpus: 1.5
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        depends_on:
            - app-dev-worker

    app-dev-worker:
        image: ag-music-server/dev:${TAG:-latest}
        env_file:
            - .env
        environment:
            - TZ=${TZ:-Asia/Ho_Chi_Minh}
            - APP_ROLE=worker
            - EXPORT_WORKER_THREADS=1
            - NODE_OPTIONS=--max-old-space-size=768
        command: yarn start:prod
        restart: unless-stopped
        volumes:
            - ./proto:/app/proto:ro
            - ./credential.json:/app/credential.json:ro
            - ./secrets:/app/secrets:ro
            - ./database.rclone.conf:/app/database.rclone.conf:ro
            - ./release_parsed:${RELEASE_PARSED_DIR}
        mem_limit: 1g
        cpus: 0.5
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
