services:
    app-prod:
        # image: ag-music-server/prod:latest
        image: ag-music-server/prod:${TAG:-latest}
        build: .
        # pull the port number from $PORT for both host and container
        ports:
            - '${HOST_PORT:-4042}:${APP_PORT}'
        env_file:
            - .env
        environment:
            - TZ=${TZ:-Asia/Ho_Chi_Minh}
            - APP_ROLE=api
        command: yarn start:prod
        restart: unless-stopped
        volumes:
            - ./proto:/app/proto:ro
            - ./credential.json:/app/credential.json:ro
            - ./secrets:/app/secrets:ro
            - ./database.rclone.conf:/app/database.rclone.conf:ro
            - ./release_parsed:${RELEASE_PARSED_DIR}
        mem_limit: 4g
        cpus: 2
        depends_on:
            - app-prod-worker

    app-prod-worker:
        image: ag-music-server/prod:${TAG:-latest}
        env_file:
            - .env
        environment:
            - TZ=${TZ:-Asia/Ho_Chi_Minh}
            - APP_ROLE=worker
        command: yarn start:prod
        restart: unless-stopped
        volumes:
            - ./proto:/app/proto:ro
            - ./credential.json:/app/credential.json:ro
            - ./secrets:/app/secrets:ro
            - ./database.rclone.conf:/app/database.rclone.conf:ro
            - ./release_parsed:${RELEASE_PARSED_DIR}
        mem_limit: 1g
        cpus: 1  
